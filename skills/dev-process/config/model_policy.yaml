# dev-process model policy (logical roles → Hermes profile names).
# schema_version 2 only. Configure API models in ~/.hermes/profiles/<name>/config.yaml.
#
# Tier intent (examples only — not bound here):
#   dp-strong  → gpt-5.5 high   (spec/plan/deep review/final)
#   dp-review  → gpt-5.5 medium (standard review / implementation checkpoint)
#   dp-code    → gpt-5.4 medium (implement / write_tests / fix)
#   dp-cheap   → gpt-5.4-mini low (gates / run_tests / log summary)

schema_version: 2

profiles:
  strong_reasoning: dp-strong
  review_main: dp-review
  code_main: dp-code
  cheap_aux: dp-cheap

# usage_stage_id → action (for --stage-id / artifacts.model_usage rows; not state.yaml current_stage)
stage_actions:
  spec_review: spec
  human_spec_gate: record_gate
  plan_review: plan
  test_review: write_tests
  implementation: implement
  implementation_review: review_standard
  final_review: final_review
  final_summary: final_summary
  final_human_gate: record_gate

# state.yaml current_stage only (orchestrator). "review" is not a state stage —
# checkpoint review uses current_stage=implementation + --stage-id implementation_review.
stage_defaults:
  spec: strong_reasoning
  plan: strong_reasoning
  human_spec_gate: cheap_aux
  implementation: code_main
  test: code_main
  final: strong_reasoning
  final_human_gate: cheap_aux
  completed: cheap_aux

action_overrides:
  spec: strong_reasoning
  plan: strong_reasoning
  implement: code_main
  write_tests: code_main
  run_tests: cheap_aux
  summarize_test_logs: cheap_aux
  fix_test_failure: code_main
  review_light: cheap_aux
  review_standard: review_main
  review_deep: strong_reasoning
  review_requirements: review_main
  review_architecture: review_main
  review_impact: review_main
  review_diff_detail: review_main
  review_test_quality: review_main
  review_checklist_compliance: review_main
  review_naming_doc: review_main
  review_synthesis_standard: review_main
  review_synthesis_deep: strong_reasoning
  review_synthesis_final: strong_reasoning
  final_review: strong_reasoning
  final_summary: cheap_aux
  record_gate: cheap_aux

reasoning_by_preset:
  light:
    strong_reasoning: medium
    review_main: medium
    code_main: medium
    cheap_aux: low
  standard:
    strong_reasoning: medium
    review_main: medium
    code_main: medium
    cheap_aux: low
  deep:
    strong_reasoning: high
    review_main: medium
    code_main: medium
    cheap_aux: medium

action_reasoning_overrides:
  light:
    review_synthesis_final: high
  standard:
    review_synthesis_final: high
  deep:
    record_gate: low
    run_tests: low
    summarize_test_logs: low
    final_summary: medium
    review_synthesis_deep: high
    review_synthesis_final: high
