# Example Hermes profile config snippets for dev-process (NOT loaded by helpers).
# Runtime tier expectations: config/hermes_profile_expectations.yaml
# (read by check_hermes_profiles.py). Provider/model IDs below are examples only.
#
#   hermes profile create dp-strong --clone
#   hermes profile create dp-review --clone
#   hermes profile create dp-code --clone
#   hermes profile create dp-cheap --clone
#
# Edit each profile's config under ~/.hermes/profiles/<name>/config.yaml
# Policy mapping: config/model_policy.yaml

documentation_profiles:
  dp-strong:
    purpose: spec / plan / deep review / final synthesis
    recommended_main_model: gpt-5.5
    recommended_reasoning_effort: high
  dp-review:
    purpose: standard review, implementation checkpoint synthesis
    recommended_main_model: gpt-5.5
    recommended_reasoning_effort: medium
  dp-code:
    purpose: implementation, test authoring, fixes
    recommended_main_model: gpt-5.4
    recommended_reasoning_effort: medium
  dp-cheap:
    purpose: gate recording, test log summaries, run_tests hints
    recommended_main_model: gpt-5.4-mini
    recommended_reasoning_effort: low

# reasoning_by_preset → reasoning_expected in artifacts is policy-only (not runtime).

profile_config_snippets:
  dp-strong:
    model:
      default: gpt-5.5
    agent:
      reasoning_effort: high
  dp-review:
    model:
      default: gpt-5.5
    agent:
      reasoning_effort: medium
  dp-code:
    model:
      default: gpt-5.4
    agent:
      reasoning_effort: medium
  dp-cheap:
    model:
      default: gpt-5.4-mini
    agent:
      reasoning_effort: low
