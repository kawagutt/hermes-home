# Task state (template)
# Copy to .hermes/tasks/<task-id>/state.yaml and fill. Boolean flags are examples.

task_id: ""
current_stage: ""      # e.g. spec | plan | test | implementation | final
current_phase: ""      # e.g. 01 or null when N/A

approved:
  spec: false
  human_spec_gate: false
  plan: false
  # tests: optional extra human sign-off; many teams use reviewed.tests instead
  tests: false

# Review-stage completion (e.g. test review synthesis clear) — finer than blanket approved.tests
reviewed:
  spec: false
  plan: false
  tests: false
  final: false

escalation:
  required: false
  reason: ""

artifacts:
  spec: spec.md
  plan: plan.md
  test_plan: test_plan.md
  red_test_result: red_test_result.md
  final_test_result: final_test_result.md
  implementation_log: implementation_log.md
  final_review: reviews/final/synthesis.md
