# Task state (template)
# Copy to .hermes/tasks/<task-id>/state.yaml and fill. Boolean flags are examples.
#
# task_id: use YYYYMMDD_<short-slug> (date first), e.g. 20260509_bounded-goal-dev-process

task_id: ""
current_stage: ""      # e.g. spec | plan | test | implementation | final | final_human_gate
                       # Gate wait is authoritative in pending_human_gate (not current_stage alone).
current_job: ""        # v4: open job id from jobs.yaml (cleared on job close)
current_phase: ""      # e.g. 01 or null when N/A

# Human gate wait (authoritative). Set by gate presenter before numbered choices in chat; cleared after any explicit human gate decision.
pending_human_gate: ""      # "" | human_spec_gate | final_human_gate
gate_prompted_at: ""        # ISO-8601 timestamp when gate choices were prepared

# Set when plan is approved (light | standard | deep). Leave empty until then; helpers may infer from artifacts.plan.
review_depth_preset: ""

# Pre-v4: set from approved plan (true | false). null = infer (legacy validators).
# v4: session/model evidence is always via jobs.yaml; this field is optional / ignored.
model_usage_required: null

# v4: session/model/profile evidence lives in jobs.yaml only (not last_* fields here).

# Hard human gates only (human_spec_gate, final_human_gate). Gate decisions use these keys — not approved.spec.
# Legacy: approved.spec in older task state.yaml is non-canonical; ignore for plan legality; use approved.human_spec_gate.
approved:
  human_spec_gate: false
  final_human_gate: false

# Review-pass markers (Proceed / stage accepted only). Not synthesis-executed markers.
# Synthesis sets reviewed.*: true only on Proceed; rework/blocking rounds must not set true.
# Keys are only those below — do not invent reviewed.* from review target names (e.g. final_diff, implementation_phase).
# Mapping: spec review -> reviewed.spec; plan -> reviewed.plan; test -> reviewed.tests;
#   final or final_diff review -> reviewed.final; implementation_phase checkpoint -> no reviewed.* (review_rounds only).
reviewed:
  spec: false
  plan: false
  tests: false
  final: false

escalation:
  required: false
  reason: ""

# Count of completed review rounds per stage (increment when that round finishes).
# Next run uses subdirectory round_NN (zero-padded, e.g. round_02). Add phase keys as needed.
# Maintainer: synthesis-role agent normally; see review/SKILL.md § Who updates state.yaml.
review_rounds:
  spec: 0
  plan: 0
  test: 0
  final: 0
  # Add keys per implementation phase as needed, e.g. implementation_phase_02: 0
  implementation_phase_01: 0

# Pointers to the latest synthesis for quick access — update same time as review_rounds.
# Humans are not expected to edit these in routine agent-driven runs.
latest_reviews:
  spec: ""    # e.g. reviews/spec/round_01/synthesis.md
  plan: ""
  test: ""
  final: ""    # canonical pointer for final synthesis; do not duplicate elsewhere
  implementation_phase_01: ""   # add matching implementation_phase_* keys as phases exist

branch:
  name: ""
  feasibility_checked_before_human_spec_gate: false
  feasibility_notes: ""
  task_branch_precondition_met: false   # create/switch after plan review, before test implementation
  commits_allowed_on_task_branch: false # test and product commits on the task branch (when in scope for this task)
  task_artifacts_commit_by_default: false

# Task-root Markdown: logical key → current filename (NNNN_<stem>.md). Canonical rules: skills/dev-process/artifacts/SKILL.md § Numbered task-root artifacts (#numbered-task-root-artifacts).
# If a key is "", first materialization: next NNNN = max(four-digit prefixes on task-root NNNN_*.md) + 1, create NNNN_<stem>.md, set this key in the same session.
artifacts:
  spec: ""
  spec_summary_ja: ""
  human_spec_gate: ""
  plan: ""
  phase_checklists: ""
  timeline: ""
  rework_log: ""
  model_usage: ""
  test_plan: ""
  test_implementation: ""
  red_test_result: ""
  implementation_log: ""
  phase_results: ""
  final_test_result: ""
  final_summary_ja: ""
  final_human_gate: ""
